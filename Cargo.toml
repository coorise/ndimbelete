[package]
name = "ndimbelente-ui"
version = "0.1.6"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.3", features = ["futures"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind", "serde"] }
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlBodyElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "Node",
  "CssStyleDeclaration",
  "DomTokenList",
  "Storage",
  "console",
  "KeyboardEvent",
  "EventTarget",
  "InputEvent",
  "DragEvent",
  "DataTransfer",
] }

[workspace]
members = ["src-tauri"]

# Release optimizations for the desktop binary (Tauri).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
