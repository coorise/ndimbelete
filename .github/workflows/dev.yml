# Dev prerelease — runs on every push to `dev`.
# Work here with the team; do not push feature work to `main`.

name: Dev release (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Add macOS compilation targets (Apple Silicon + Intel Universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build CSS
        run: bun run css:build

      - name: Publish Tauri prerelease
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDIMBELENTE_UPDATE_CHANNEL: dev
          # Baked into the binary as the default collaboration URI (setup + navbar).
          NDIMBELENTE_BAKED_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        with:
          projectPath: src-tauri
          tagName: dev-v__VERSION__
          releaseName: "Ndimbelente Dev v__VERSION__"
          releaseBody: |
            Development build from `dev` (prerelease).

            Cross-platform desktop application:
            - **Windows**: `.exe` (installer) / `.msi`
            - **macOS**: `.dmg` (Universal: Apple Silicon M1/M2/M3/M4 + Intel Core i3/i5/i7/i9)
            - **Linux**: `.AppImage` / `.deb`

            Collaboration remote defaults to the DEV database when configured.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
