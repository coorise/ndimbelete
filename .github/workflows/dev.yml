name: Dev release (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build CSS
        run: bun run css:build

      - name: Publish Tauri prerelease
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDIMBELENTE_UPDATE_CHANNEL: dev
        with:
          projectPath: src-tauri
          tagName: dev-v__VERSION__
          releaseName: "Ndimbelente Dev v__VERSION__"
          releaseBody: |
            Development build from `dev` (prerelease).

            Install the Windows setup from the assets below.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
